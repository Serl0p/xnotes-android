name: xNotes emulator startup smoke

on:
  push:
    branches: ['extensions/startup-hotfix']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install native and Android compile toolchain
        run: sdkmanager "platforms;android-36" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Build experimental APK
        run: bash ./gradlew --no-daemon assembleDebug
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator, install app, and assert startup survival
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/ci/startup-smoke.sh
      - name: Upload screenshots and crash diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: startup-smoke-diagnostics-${{ github.run_id }}
          path: startup-smoke/
          retention-days: 14
          if-no-files-found: ignore
